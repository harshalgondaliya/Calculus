<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton Divided Difference</title>
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="newton_divided.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script>
        function divided() {
            // Replace 'photo.jpg' with the path to your photo
            window.open('divided.jpg', '_blank');
        }
    </script>

</head>

<body>
    <div class="container">
        <h1>Newton Divided Difference Interpolation Polynomial</h1>
        <div id="input">
            <label for="xValues">
                <i class='bx bx-x'></i> Enter x values
            </label>
            <input type="text" placeholder="(Comma separated)" id="xValues">
            
            <label for="yValues">
                <i class='bx bx-y'></i> Enter f(x) values
            </label>
            <input type="text" placeholder="(Comma separated)" id="yValues">
            
            <label for="x">
                <i class='bx bx-calculator'></i> Enter finding x value
            </label>
            <input type="number" placeholder="(Initial values)" id="x">
            
            <button onclick="calculateInterpolation()">
                <i class='bx bx-calculator'></i> Calculate Divided Difference
            </button>
        </div>
        <div id="output">
            <h2>Result:</h2>
            <p id="result"></p>
        </div>
    </div>

    <div class="photo">
        <h3>View the Newton Divided Difference Method Format</h3>
        <button onclick="divided()">
            <i class='bx bx-image-alt'></i> View Format
        </button>
    </div>

    <!--===== SCROLL REVEAL =====-->
    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="newton_divided.js">
    </script>

</body>

</html>
