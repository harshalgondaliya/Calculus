<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus Exam Preparation</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/boxicons/2.0.7/css/boxicons.min.css">
</head>

<body>
    <!-- Overlay for blur effect -->
    <div id="overlay" class="overlay"></div>
    
    <div class="container">
        <h1>Calculus Exam Preparation</h1>
        <p>Select a topic to practice and enhance your calculus skills</p>

        <div class="button-container">
            <button onclick="interpolation()">
                <i class='bx bx-line-chart'></i>
                <span>Interpolation</span>
            </button>
            <button onclick="gauss()">
                <i class='bx bx-equalizer'></i>
                <span>Gauss Linear Equation</span>
            </button>
            <button onclick="coorelate()">
                <i class='bx bx-trending-up'></i>
                <span>Correlation</span>
            </button>
            <button onclick="ni()">
                <i class='bx bx-calculator'></i>
                <span>Numerical Integration</span>
            </button>
            <button onclick="gr()">
                <i class='bx bx-grid-alt'></i>
                <span>Gauss Rank of Matrix</span>
            </button>
            <button onclick="le()">
                <i class='bx bx-minus-front'></i>
                <span>Linear Equation Gauss Elimination</span>
            </button>
            <button onclick="ji()">
                <i class='bx bx-sort'></i>
                <span>Gauss Jordan Elimination</span>
            </button>
        </div>
        
        <!-- Submenus for each category -->
        <div class="submenu-container">
            <!-- Interpolation Submenu -->
            <div id="interpolation-menu" class="submenu">
                <div class="submenu-header">
                    <h3>Choose an Interpolation Topic</h3>
                    <button class="close-submenu" onclick="closeAllSubmenus()">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
                <div class="submenu-options">
                    <button onclick="navigateTo('1.Newton_interpolation/newton_interpolation.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>Newton Interpolation</span>
                    </button>
                    <button onclick="navigateTo('1.Newton_Divided_Difference/newton_divided.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>Newton Divided Difference</span>
                    </button>
                    <button onclick="navigateTo('1.Lagrange/lagrange.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>Lagrange's Interpolation</span>
                    </button>
                </div>
            </div>
            
            <!-- Gauss Linear Equation Submenu -->
            <div id="gauss-menu" class="submenu">
                <div class="submenu-header">
                    <h3>Choose a Gauss Method</h3>
                    <button class="close-submenu" onclick="closeAllSubmenus()">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
                <div class="submenu-options">
                    <button onclick="navigateTo('2.Gauss/gauss_jacobi.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>Gauss Jacobi Method</span>
                    </button>
                    <button onclick="navigateTo('2.Gauss/gauss_seidal.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>Gauss Seidal Method</span>
                    </button>
                </div>
            </div>
            
            <!-- Correlation Submenu -->
            <div id="correlation-menu" class="submenu">
                <div class="submenu-header">
                    <h3>Choose a Correlation Method</h3>
                    <button class="close-submenu" onclick="closeAllSubmenus()">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
                <div class="submenu-options">
                    <button onclick="navigateTo('3.Coorelation/kp.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>Karl Pearson's Coefficient of Correlation</span>
                    </button>
                    <button onclick="navigateTo('3.Coorelation/sr.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>Spearman's Rank Correlation Coefficient</span>
                    </button>
                </div>
            </div>
            
            <!-- Numerical Integration Submenu -->
            <div id="numerical-integration-menu" class="submenu">
                <div class="submenu-header">
                    <h3>Choose a Numerical Integration Method</h3>
                    <button class="close-submenu" onclick="closeAllSubmenus()">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
                <div class="submenu-options">
                    <button onclick="navigateTo('4.Numerical_Integration/tr.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>The Trapezoidal Rule</span>
                    </button>
                    <button onclick="navigateTo('4.Numerical_Integration/si1.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>The Simpson's 1/3 Rule</span>
                    </button>
                    <button onclick="navigateTo('4.Numerical_Integration/si2.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>The Simpson's 3/8 Rule</span>
                    </button>
                </div>
            </div>
            
            <!-- Jordan Elimination Submenu -->
            <div id="jordan-elimination-menu" class="submenu">
                <div class="submenu-header">
                    <h3>Choose a Jordan Elimination Method</h3>
                    <button class="close-submenu" onclick="closeAllSubmenus()">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
                <div class="submenu-options">
                    <button onclick="navigateTo('7.Inverse/LJE.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>The Gauss Linear Jordan Elimination</span>
                    </button>
                    <button onclick="navigateTo('7.Inverse/IJE.html')">
                        <i class='bx bx-chevron-right'></i>
                        <span>The Gauss Inverse Jordan Elimination</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!--===== SCROLL REVEAL =====-->
    <script src="https://unpkg.com/scrollreveal"></script>

    <script>
        // Initialize ScrollReveal
        ScrollReveal().reveal('.button-container button', {
            delay: 200,
            interval: 100,
            origin: 'bottom',
            distance: '20px',
            easing: 'ease-out'
        });

        function showSubMenu(menuId) {
            // Hide all submenus first
            document.querySelectorAll('.submenu').forEach(menu => {
                menu.style.display = 'none';
            });
            
            // Show the overlay
            document.getElementById('overlay').classList.add('active');
            
            // Show the selected submenu
            const submenu = document.getElementById(menuId);
            if (submenu) {
                submenu.style.display = 'block';
                submenu.classList.add('active');
            }
        }
        
        function closeAllSubmenus() {
            // Hide all submenus
            document.querySelectorAll('.submenu').forEach(menu => {
                menu.style.display = 'none';
                menu.classList.remove('active');
            });
            
            // Hide the overlay
            document.getElementById('overlay').classList.remove('active');
        }
        
        function interpolation() {
            showSubMenu('interpolation-menu');
        }

        function gauss() {
            showSubMenu('gauss-menu');
        }

        function coorelate() {
            showSubMenu('correlation-menu');
        }

        function ni() {
            showSubMenu('numerical-integration-menu');
        }

        function gr() {
            window.location.href = "5.Gauss_Rank/r.html";
        }

        function le() {
            window.location.href = "6.Elimination/el.html"
        }

        function ji() {
            showSubMenu('jordan-elimination-menu');
        }
        
        // Navigation functions for submenu items
        function navigateTo(url) {
            window.location.href = url;
        }
        
        // Close all submenus when clicking outside or on the overlay
        document.addEventListener('click', function(event) {
            if ((!event.target.closest('.button-container') && !event.target.closest('.submenu-container')) || 
                event.target.classList.contains('overlay')) {
                closeAllSubmenus();
            }
        });
        
        // Also close submenus when escape key is pressed
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeAllSubmenus();
            }
        });
    </script>

</body>

</html>
