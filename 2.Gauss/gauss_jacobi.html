<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauss-Jacobi Method</title>
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="gauss_jacobi.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- JavaScript is loaded from external file -->
</head>

<body>
    <div class="container">
        <h1>Gauss-Jacobi Method</h1>
        <p class="subtitle">Solve system of linear equations using Gauss-Jacobi iteration method</p>
        
        <div class="input-section">
            <div class="input-group">
                <label for="equations">Number of Equations</label>
                <input type="number" id="equations" value="3" min="2" max="10" class="number-input">
            </div>

            <div class="matrix-section">
                <h3>Enter Coefficients Matrix (A) and Constants Vector (B):</h3>
                <table id="inputTable">
                    <!-- Coefficients input will be generated here -->
                </table>
            </div>

            <div class="input-group">
                <label for="iterations">Number of Iterations</label>
                <input type="number" id="iterations" value="10" min="1" max="100" class="number-input">
            </div>

            <button onclick="gaussJacobi()" class="calculate-btn">
                <i class='bx bx-calculator'></i>
                <span>Calculate Solution</span>
            </button>
        </div>

        <div class="result-section">
            <h2>Results</h2>
            <div id="output" class="result-content"></div>
        </div>
    </div>

    <script src="gauss_jacobi.js"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <script>
        ScrollReveal().reveal('.input-section', {
            delay: 200,
            interval: 100,
            origin: 'bottom',
            distance: '20px',
            easing: 'ease-out'
        });
    </script>
</body>

</html>
