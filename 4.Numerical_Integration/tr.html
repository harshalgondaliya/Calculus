<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapezoidal Rule</title>
    <link rel="stylesheet" href="tr.css">
</head>

<body>
    <div class="container">
        <h1>Trapezoidal Rule</h1>
        <p class="subtitle">Numerical Integration using Trapezoidal Rule</p>
        
        <div class="input-section">
            <div class="input-group">
                <label for="function">Function f(x)</label>
                <input type="text" id="function" placeholder="e.g., x^2 + 2x + 1" class="function-input">
            </div>
            
            <div class="limits-group">
                <div class="input-group">
                    <label for="lowerLimit">Lower Limit (a)</label>
                    <input type="number" id="lowerLimit" placeholder="Enter lower limit" step="any">
                </div>
                
                <div class="input-group">
                    <label for="upperLimit">Upper Limit (b)</label>
                    <input type="number" id="upperLimit" placeholder="Enter upper limit" step="any">
                </div>
            </div>
            
            <div class="input-group">
                <label for="intervals">Number of Intervals (n)</label>
                <input type="number" id="intervals" placeholder="Enter number of intervals" min="1" step="1">
            </div>
            
            <button onclick="calculateIntegral()" class="calculate-btn">
                <span>Calculate Integral</span>
            </button>
        </div>

        <div class="result-section">
            <h2>Results</h2>
            <div id="result" class="result-content"></div>
            <div id="steps" class="steps-section"></div>
        </div>
    </div>

    <script src="tr.js"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <script>
        ScrollReveal().reveal('.input-section', {
            delay: 200,
            interval: 100,
            origin: 'bottom',
            distance: '20px',
            easing: 'ease-out'
        });
    </script>
</body>

</html>
