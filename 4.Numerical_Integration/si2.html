<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simpson's 3/8 Rule</title>
    <link rel="stylesheet" href="si2.css">
    <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/boxicons/2.0.7/css/boxicons.min.css">
</head>

<body>
    <div class="container">
        <h1>Simpson's 3/8 Rule</h1>
        <div class="input-section">
            <div class="input-group">
                <label for="function">Enter function f(x):</label>
                <input type="text" id="function" placeholder="e.g., x^2 + 2x + 1">
            </div>
            <div class="input-group">
                <label for="lowerLimit">Lower limit (a):</label>
                <input type="number" id="lowerLimit" placeholder="Enter lower limit">
            </div>
            <div class="input-group">
                <label for="upperLimit">Upper limit (b):</label>
                <input type="number" id="upperLimit" placeholder="Enter upper limit">
            </div>
            <div class="input-group">
                <label for="intervals">Number of intervals (n):</label>
                <input type="number" id="intervals" placeholder="Enter number of intervals">
            </div>
            <button onclick="calculateIntegral()">
                <i class='bx bx-calculator'></i>
                <span>Calculate Integral</span>
            </button>
        </div>
        <div class="result-section">
            <h2>Results:</h2>
            <div id="result"></div>
        </div>
    </div>

    <!--===== SCROLL REVEAL =====-->
    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="si2.js"></script>
</body>

</html>
